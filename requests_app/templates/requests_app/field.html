<div class="form-field {% if full %}full{% endif %}">
    <label for="{{ field.id_for_label }}">
        {{ field.label }}

        {% if field.field.required %}
            *
        {% endif %}
    </label>

    {{ field }}

    {% if field.help_text %}
        <small class="help-text">
            {{ field.help_text }}
        </small>
    {% endif %}

    {% if field.errors %}
        <div class="error-list">
            {{ field.errors }}
        </div>
    {% endif %}
</div>
