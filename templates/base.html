{% load static %}
<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <meta
        name="description"
        content="Avaliações educacionais e diagnóstico pedagógico da Editora Dinâmica."
    >

    <title>
        {% block title %}Dinâmica Simulados{% endblock %}
    </title>

    <link
        rel="stylesheet"
        href="{% static 'css/main.css' %}"
    >
</head>

<body>
    <header class="site-header">
        <a class="brand" href="/">
            <span class="brand-mark">D</span>

            <span>
                <strong>Dinâmica</strong>
                <small>Simulados</small>
            </span>
        </a>
    </header>

    <main class="page">
        {% block content %}{% endblock %}
    </main>

    <footer class="site-footer">
        <p>
            Editora Dinâmica — Avaliação e diagnóstico pedagógico
        </p>
    </footer>
</body>
</html>
