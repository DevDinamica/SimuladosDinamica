<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >
    <title>Dinâmica Simulados</title>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            min-height: 100vh;
            margin: 0;
            display: grid;
            place-items: center;
            background:
                radial-gradient(circle at top, #294b8f, #101c38 65%);
            color: #ffffff;
            font-family: Arial, sans-serif;
        }

        main {
            width: min(90%, 720px);
            padding: 48px;
            border: 1px solid rgba(255, 255, 255, 0.16);
            border-radius: 24px;
            background: rgba(11, 22, 45, 0.82);
            box-shadow: 0 24px 80px rgba(0, 0, 0, 0.35);
            text-align: center;
        }

        .status {
            display: inline-block;
            margin-bottom: 20px;
            padding: 8px 14px;
            border-radius: 999px;
            background: #22c55e;
            color: #062b14;
            font-size: 13px;
            font-weight: bold;
            text-transform: uppercase;
        }

        h1 {
            margin: 0 0 16px;
            font-size: clamp(36px, 7vw, 64px);
        }

        p {
            margin: 0;
            color: #bfcae2;
            font-size: 18px;
            line-height: 1.6;
        }

        a {
            display: inline-block;
            margin-top: 32px;
            padding: 14px 24px;
            border-radius: 12px;
            background: #ffffff;
            color: #17264a;
            font-weight: bold;
            text-decoration: none;
        }
    </style>
</head>

<body>
    <main>
        <span class="status">Sistema operacional</span>

        <h1>Dinâmica Simulados</h1>

        <p>
            Gestão de aplicações, cartões-resposta e indicadores
            pedagógicos da Editora Dinâmica.
        </p>

        <a href="/admin/">
            Acessar administração
        </a>
    </main>
</body>
</html>
